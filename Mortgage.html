<html>
    <head>

    <style>
        p{
            width: 320px;
            height: 50px;
            padding: 5px;
            border: 5px solid black;
            margin: auto;

            background-color: darkgrey;
        }
        form{

         text-align: center;
         font-size: large;
         margin: auto;
            width: 50%;
         padding: 50px 0;
         
        }
        input{
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        
    </style>
    <header>
        <h1> Mortgage </h1>
        <img src="logo.png" alt="logo" style=" position: absolute; top: 30px; left: 30px; max-height: 130px;">
        <img src="logo.png" alt="logo" style=" position: absolute; top: 30px; right: 30px; max-height: 130px;">
    </header>


    <body>
        <main>
            <form id="calculator">
            
                <label for="Loan">Amount:</label>
                <input type="number" id="Loan" name="Loan" placeholder="Enter Loan Amount" required>
                <br><br>
    
                
                <label for="term">Term (years):</label>
                <input type="number" id="term" name="term" placeholder="Enter Years for Loan Term" required>
                <br><br>
    
                <label for="income">Monthly Income:</label>
                <input type="number" id="income" name="income" placeholder="Enter your monthly income" required>
                <br><br>
    
                <button type="button" id="submission">Submit</button>
            </form>
            <br>
        </main>


        <h3 style="text-align: center;"> Breakdown : </h3>
        <p class="output" id="output1"> Monthly Payment (£) </p>
        <p class="output" id="output2"> Total Repayment (£) </p>
        <p class="output" id="output3"> Percentage of monthly income </p>
        <br>
        <script type="text/javascript">
            
                    function fun1(){
                        var button = document.getElementById("submission").value; 
                        var P = document.getElementById("Loan").value;
                        var n = document.getElementById("term").value*12;
                        var r = 0.045/12
                        var x = (P*r*(1+r)**n)/((1+r)**n -1)
                        var z = document.getElementById("income").value
                        var out1 = document.getElementById("output1").value
                        var threshold = 0.30*z

                        if (x  < threshold){

                            document.getElementById("output1").innerHTML = "Monthly Payment: £" + parseFloat(x.toFixed(2));
                            document.getElementById("output2").innerHTML = "Total Repayment: £" + parseFloat((x*n).toFixed(2));
                            document.getElementById("output3").innerHTML = "Percentage of monthly income :"+parseFloat(((x/z)*100).toFixed(2)) + "%";
                        } else{

                            alert("Loan denied: Monthy payment exceeds 30% of your income")

                        }

                        
                    }
                    submission.addEventListener('click',fun1)
        </script>

    

    
    </body>
